# LiveKit Server 本地开发配置
# 来源: deploy/livekit/livekit.yaml，本地去掉了外部证书路径
#
# 启动方式:
#   ./run_livekit_server.sh         # 前台（自动使用此配置）
#   livekit-server --config ./livekit.yaml
#
port: 7880
bind_addresses:
  - 0.0.0.0

keys:
  eidolon: eidolon-livekit-secret-2026

# TURN: 本地开发不传 TLS 证书文件则 TURN TLS 自动关闭，
#       仅保留 UDP/TCP 回退，仍可正常直连。
#       如需完整 TURN，请指向有效证书路径，或在生产环境使用 deploy/livekit/livekit.yaml
turn:
  enabled: true
  udp_port: 3478
  # cert_file / key_file 留空，TLS 功能自动禁用

rtc:
  port_range_start: 50000
  port_range_end: 60000
  # use_external_ip: true  # 生产环境需要；本地 docker/局域网酌情开启

logging:
  level: debug
  json: false
