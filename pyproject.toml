[project]
name = "eidolon-hub"
version = "0.1.0"
description = "Eidolon Hub - Unified device接入层和Agent适配层"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "eidolon-sdk[devices,livekit]",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml",
    "uvicorn[standard]>=0.27",
    "fastapi>=0.109",
    "httpx>=0.27",
    "cryptography>=43",
    "python-jose[cryptography]>=3.3",
    "aiomqtt>=2.0",
    "livekit-api>=0.5",
    "python-dotenv>=1.0",
    "zeroconf>=0.131",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hub*"]

[project.optional-dependencies]
control-bridge = [
    "livekit>=1.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpserver>=1.0",
    "ruff>=0.3",
]

[tool.uv.sources]
eidolon-sdk = { path = "../eidolon_sdk", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
