[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolon-hub"
version = "0.1.0"
description = "Eidolon Hub - device onboarding and management control plane"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"

dependencies = [
    "eidolon-sdk",
    "pydantic>=2.0",
    "pyyaml",
    "uvicorn[standard]>=0.27",
    "fastapi>=0.109",
    "httpx>=0.27",
    "python-jose>=3.3",
    "python-dotenv>=1.0",
    "zeroconf>=0.131",
    "ifaddr>=0.2",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
]

[tool.uv.sources]
eidolon-sdk = { path = "../eidolon_sdk", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["hub*"]

[tool.setuptools.package-data]
"hub.contracts" = [
    "schemas/*/*.schema.json",
    "examples/*.json",
]
[tool.setuptools.data-files]
"config" = ["config/settings.yaml"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpserver>=1.0",
    "ruff>=0.3",
    "import-linter>=2.0",
    "hypothesis-jsonschema>=0.23",
    "datamodel-code-generator>=0.35,<0.36",
    "pytest-cov>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
