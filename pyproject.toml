[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolon-hub"
version = "0.1.0"
description = "Eidolon Hub - device access and management control plane"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "pydantic>=2.0",
    "pyyaml",
    "uvicorn[standard]>=0.27",
    "fastapi>=0.109",
    "httpx>=0.27",
    "cryptography>=43",
    "python-jose[cryptography]>=3.3",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "python-dotenv>=1.0",
    "zeroconf>=0.131",
    "ifaddr>=0.2",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[project.scripts]
eidolon-hub-migrate = "hub.composition.migrate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hub*"]

[tool.setuptools.package-data]
"hub.contracts" = [
    "schemas/*/*.schema.json",
    "examples/*.json",
]
"hub.adapters.persistence.migrations" = ["script.py.mako"]

[tool.setuptools.data-files]
"config" = ["config/settings.local.yaml", "config/settings.cloud.yaml"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpserver>=1.0",
    "ruff>=0.3",
    "import-linter>=2.0",
    "hypothesis-jsonschema>=0.23",
    "datamodel-code-generator>=0.35,<0.36",
    "pytest-cov>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
