asyncapi: 3.0.0
info:
  title: Eidolon Hub MQTT5 Connection and Channel Signaling
  version: 1.0.0
  description: MQTT is restricted to connection lifecycle and channel signaling.
channels:
  connectionInbound:
    address: eidolon/v1/devices/{deviceId}/connection/in
    messages:
      hello: { $ref: '#/components/messages/hello' }
      proof: { $ref: '#/components/messages/proof' }
      heartbeat: { $ref: '#/components/messages/heartbeat' }
      registration: { $ref: '#/components/messages/registration' }
      closed: { $ref: '#/components/messages/closed' }
      channelAccept: { $ref: '#/components/messages/channelAccept' }
      channelClose: { $ref: '#/components/messages/channelClose' }
  connectionOutbound:
    address: eidolon/v1/devices/{deviceId}/connection/out
    messages:
      challenge: { $ref: '#/components/messages/challenge' }
      accepted: { $ref: '#/components/messages/accepted' }
      channelGrant: { $ref: '#/components/messages/channelGrant' }
operations:
  receiveConnection:
    action: receive
    channel: { $ref: '#/channels/connectionInbound' }
  sendConnection:
    action: send
    channel: { $ref: '#/channels/connectionOutbound' }
components:
  messages:
    hello: { payload: { $ref: '../schemas/connection/lifecycle.schema.json#/$defs/hello' } }
    proof: { payload: { $ref: '../schemas/connection/lifecycle.schema.json#/$defs/proof' } }
    heartbeat: { payload: { $ref: '../schemas/connection/lifecycle.schema.json#/$defs/heartbeat' } }
    challenge: { payload: { $ref: '../schemas/connection/lifecycle.schema.json#/$defs/challenge' } }
    accepted: { payload: { $ref: '../schemas/connection/lifecycle.schema.json#/$defs/accepted' } }
    registration: { payload: { $ref: '../schemas/connection/registration.schema.json' } }
    closed: { payload: { $ref: '../schemas/connection/lifecycle.schema.json#/$defs/closed' } }
    channelAccept: { payload: { $ref: '../schemas/channel/negotiation-signal.schema.json' } }
    channelClose: { payload: { $ref: '../schemas/channel/negotiation-signal.schema.json' } }
    channelGrant: { payload: { $ref: '../schemas/channel/channel.schema.json' } }
