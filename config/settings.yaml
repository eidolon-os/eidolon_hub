# Hub structured non-secret settings; credentials are loaded from config/.env.

api:
  host: 0.0.0.0
  port: 8082

observability:
  enabled: true
  service_name: eidolon-hub
  # Prefer the standard OTEL_EXPORTER_OTLP_ENDPOINT environment variable.
  otlp_endpoint: ""

connection_plane:
  hub_id: eidolon-hub-local
  hub_instance_id: eidolon-hub-local-1
  public_base_url: https://eidolon-hub.local:8082
  lease_seconds: 45
  heartbeat_after_ms: 15000
  # Discovery publisher: advertises Descriptor URI but never creates a
  # ConnectionLease. It is grouped here as part of Connection Plane ingress.
  mdns:
    enabled: true
    service_type: _eidolon-hub._tcp.local.
    service_name: Eidolon Hub._eidolon-hub._tcp.local.
    hostname: eidolon-hub
  mqtt:
    enabled: false
    connector_id: mqtt-cloud
    hostname: ""
    port: 8883
    username: ""
    password_env: EIDOLON_HUB_MQTT_PASSWORD
    priority: 100

# Hub knows only this versioned contract base. Transport/media policy and
# dynamic credentials are wholly owned by the external Channel Provider.
channel_provider:
  contract_url: http://127.0.0.1:8090/v1

persistence:
  adapter: sqlite
  sqlite_path: var/eidolon-hub.sqlite3
  postgresql_dsn_env: EIDOLON_HUB_POSTGRES_DSN
  init_schema: true
  pool_size: 10
  max_overflow: 20
  directory_cache_enabled: true
  reconciliation_seconds: 5
