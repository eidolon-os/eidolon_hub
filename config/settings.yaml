# Hub structured settings — 密钥占位符 = 环境变量名，值由 config/.env 注入

api:
  host: 0.0.0.0
  port: 8082

logging:
  level: DEBUG

livekit:
  api_url: http://127.0.0.1:7880
  api_key: LIVEKIT_API_KEY
  api_secret: LIVEKIT_API_SECRET

esp32:
  livekit_url: ""
  livekit_ip: auto
  livekit_port: 7880
  livekit_scheme: ws

mdns:
  service_type: _eidolon-hub._tcp.local.
  service_name: Eidolon Hub._eidolon-hub._tcp.local.
  hostname: eidolon-hub
  txt_version: "1"
  api_version: v1
  config_path: /api/config

admin_probe:
  enabled: true
  interval_seconds: 10
  degraded_after_missed_probes: 2
  offline_after_missed_probes: 3
  command_timeout_seconds: 30

# ESP32 设备会话策略：
# - pending_only: 默认/生产模式。已审批但未绑定或 Admin resolve 失败的设备
#   只能进入 eidolon-pending，等待完成 agent 绑定。
# - dev_direct_voice: dev/test 模式。设备仍必须通过签名校验且 approved=true；
#   当 Admin 返回未绑定/未找到时，Hub 直接签发 voice room token，便于
#   channel.providers.brain_provider=direct_llm 时绕过暂不可用的 agent/memory
#   做 ESP32 barge-in 联调。联调结束可改回 pending_only。
device_session:
  unbound_device_policy: dev_direct_voice

# Phase 32.A: hub validates user_id at /api/config time via this admin
# URL (LiveKit-standard pattern: trust participant.identity, look up
# the rest server-side). Hub does NOT sign device JWTs — channel does
# that under plan D. Phase 33.A6 removed the ``enabled`` flag — admin
# lookup is unconditional now (the legacy bypass was inconsistent
# with channel's already-removed static-token fallback).
runtime_admin:
  admin_api_url: http://127.0.0.1:9000

# Phase 3: subscribe to the agent's proactive-trigger events on NATS and wake the
# target device via a room.join control command (pure router — device_id + full
# payload come in the event). Needs a running NATS at nats_url. The subject must
# match the agent's publish subject (agent.proactive.triggered.<instance_id>);
# NATS_URL env overrides nats_url when set.
proactive_wake:
  enabled: true
  nats_url: nats://127.0.0.1:4222
  wake_subject: agent.proactive.triggered.*
  command_ttl_ms: 30000
