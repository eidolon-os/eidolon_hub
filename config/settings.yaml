# Local Hub behavior and public contracts. ASGI listen/TLS are deployment concerns.
#
# This is also the template a product Host is started from: Ops reads this file
# at the commit a release pins and rewrites the two lines below that name a
# particular Host. There is no separate deployment copy, so a default changed
# here is a default a Host gets, and Hub's own tests exercise the file a Host
# runs on. ops/component.toml declares it; tests/contract pins the two lines.

onboarding:
  # The Owner identity and signed directory survive Host replacement. Only the
  # candidate descriptor URI is rewritten when transport location changes.
  owner_domain_id: owner-local
  trust_epoch: 1
  descriptor_uri: https://eidolon-hub.local/api/device-onboarding/v1/descriptor
  descriptor_path: /etc/eidolon/owner-domain/owner_domain_descriptor.json
  owner_root_certificate_path: /etc/eidolon/owner-domain/owner_domain_root_ca.pem
  authority_signing_certificate_path: /etc/eidolon/owner-domain/authority_signing_certificate.pem
  retrieval_window_seconds: 1800

discovery:
  mdns:
    enabled: true

channel_provider:
  contract_url: http://127.0.0.1:8767/v1

device_control:
  erase_operation_ttl_seconds: 604800
  erase_reconcile_poll_seconds: 1.0

persistence:
  # Hub owns this database file; it does not share the legacy eidolon.sqlite3.
  path: $EIDOLON_STATE_ROOT/hub/eidolon-hub.sqlite3
