# Local Hub behavior and public contracts. ASGI listen/TLS are deployment concerns.

deployment:
  mode: local

observability:
  enabled: false
  service_name: eidolon-hub

device_access:
  hub_id: eidolon-hub-local
  public_base_url: https://eidolon-hub.local
  session_lease_seconds: 45
  heartbeat_after_ms: 15000

discovery:
  mdns:
    enabled: true

channel_provider:
  contract_url: http://127.0.0.1:8090/v1

persistence:
  adapter: sqlite
  path: var/eidolon-hub.sqlite3
  migrate_on_startup: true

device_directory:
  projection_interval_seconds: 5
  # A single local process sees every write through its cache; no DB polling.
  cache_refresh_seconds: null
