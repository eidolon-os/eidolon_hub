# Cloud behavior and public contracts. Override example domains before deployment.

deployment:
  mode: cloud

observability:
  enabled: true
  service_name: eidolon-hub

device_access:
  hub_id: eidolon-hub-cloud
  public_base_url: https://hub.example.com
  session_lease_seconds: 45
  heartbeat_after_ms: 15000

discovery:
  mdns:
    enabled: false

channel_provider:
  contract_url: https://channel-provider.example.com/v1

persistence:
  adapter: postgresql
  dsn: postgresql://127.0.0.1:5432/eidolon_hub
  migrate_on_startup: false
  pool_size: 10
  max_overflow: 20
  pool_timeout_seconds: 10
  pool_recycle_seconds: 1800

device_directory:
  projection_interval_seconds: 5
  cache_refresh_seconds: 30
