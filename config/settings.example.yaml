# Hub structured settings (copy to config/settings.yaml).
# Hub knows only each Provider control endpoint. Device-facing URL, room,
# token, TURN and codec details remain Provider-owned and arrive as an opaque
# binding.

api:
  host: 0.0.0.0
  port: 8082

logging:
  level: INFO

observability:
  enabled: true
  service_name: eidolon-hub
  # Prefer OTEL_EXPORTER_OTLP_ENDPOINT; empty means no export.
  otlp_endpoint: ""

# Connection adapters are independently enabled and may run together. Local
# and cloud deployments use separate configs/stores; Hub never bridges them.
connection_plane:
  hub_id: eidolon-hub-local
  hub_instance_id: eidolon-hub-local-1
  public_base_url: https://eidolon-hub.local:8082
  lease_seconds: 45
  heartbeat_after_ms: 15000
  unicast_dns_sd_service: ""
  explicit_descriptor_uris: []
  mqtt:
    enabled: false
    connector_id: mqtt-cloud
    hostname: ""
    port: 8883
    username: ""
    password_env: EIDOLON_HUB_MQTT_PASSWORD
    priority: 100

# Only logical capabilities and Provider references live in Hub config. URLs,
# rooms, credentials, TURN and codecs are generated by the external Provider.
channel_control:
  # Provider bridges WSS/LiveKit/etc. to the standard HTTP DataEnvelope API.
  management_profile: management-data
  provider_token_env: EIDOLON_HUB_PROVIDER_TOKEN
  profiles:
    management-data:
      required_kinds: [reliable-data]
      provisioner_ref: channel-provisioner/default-data
    realtime-media:
      required_kinds: [realtime-data, audio, video]
      provisioner_ref: channel-provisioner/realtime
  provider_endpoints:
    channel-provisioner/default-data: http://127.0.0.1:8090
    channel-provisioner/realtime: http://127.0.0.1:8090

mdns:
  enabled: true
  service_type: _eidolon-hub._tcp.local.
  service_name: Eidolon Hub._eidolon-hub._tcp.local.
  hostname: eidolon-hub

# SQLite is the local adapter. Cloud deployments switch only this section to
# adapter: postgresql and inject the DSN through postgresql_dsn_env.
persistence:
  adapter: sqlite
  sqlite_path: var/eidolon-hub.sqlite3
  postgresql_dsn_env: EIDOLON_HUB_POSTGRES_DSN
  init_schema: true
  pool_size: 10
  max_overflow: 20
  directory_cache_enabled: true
  reconciliation_seconds: 5
