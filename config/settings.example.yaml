# Hub structured settings (copy to config/settings.yaml).
# livekit.api_key / api_secret 占位符 = 环境变量名；值由 config/.env 注入。
# Hub and Channel point at the same LiveKit server/credentials, but use
# role-specific config fields. Hub uses livekit.api_url for server-side room
# control plus esp32.livekit_* for client signaling URL handoff.

api:
  host: 0.0.0.0
  port: 8082

logging:
  level: INFO

livekit:
  api_url: http://127.0.0.1:7880
  api_key: LIVEKIT_API_KEY
  api_secret: LIVEKIT_API_SECRET

esp32:
  # Client signaling URL for ESP32 / browsers (see resolve_eidolon_livekit_client_url).
  # This must reach the same LiveKit server as livekit.api_url, but from the LAN
  # client side instead of Hub's server-side HTTP API side.
  livekit_url: ""
  livekit_ip: auto
  livekit_port: 7880
  livekit_scheme: ws

mdns:
  service_type: _eidolon-hub._tcp.local.
  service_name: Eidolon Hub._eidolon-hub._tcp.local.
  hostname: eidolon-hub
  txt_version: "1"
  api_version: v1
  config_path: /api/config

admin_probe:
  enabled: true
  interval_seconds: 10
  degraded_after_missed_probes: 2
  offline_after_missed_probes: 3
  command_timeout_seconds: 30

# ESP32 device session policy:
# - pending_only: default/production behavior. Approved devices that are not
#   bound, or whose Admin resolve returns not-ready/not-found, stay in
#   eidolon-pending.
# - dev_direct_voice: dev/test only. The device must still pass signature
#   verification and approved=true; when Admin says unbound/not-found, Hub issues
#   a voice-room token anyway so channel.providers.brain_provider=direct_llm can
#   be tested without a usable eidolon_agent/memory path.
device_session:
  unbound_device_policy: pending_only

control_bridge:
  # Optional: join LiveKit rooms as a data-only participant to receive
  # ESP32 ack/result envelopes on eidolon.control. Requires livekit.rtc.
  enabled: false
  livekit_url: ""
  identity_prefix: eidolon-hub-control

# Hub validates owner_id at /api/config time via this admin
# URL. Hub does NOT sign device JWTs — channel does that under plan D
# (LiveKit-standard: trust participant.identity, look up server-side).
# Admin lookup is unconditional.
runtime_admin:
  admin_api_url: http://127.0.0.1:9000
