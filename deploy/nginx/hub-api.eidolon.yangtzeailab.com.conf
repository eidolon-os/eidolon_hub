
upstream eidolon_hub_api {
    server 127.0.0.1:8081;
}

server {
    listen 80;
    listen [::]:80;
    server_name hub-api.eidolon.yangtzeailab.com;

    location / {
        return 301 https://;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hub-api.eidolon.yangtzeailab.com;

    ssl_certificate     /etc/nginx/ssl/yangtzeailab.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/yangtzeailab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    access_log /var/log/nginx/hub-api-access.log;
    error_log  /var/log/nginx/hub-api-error.log;

    client_max_body_size 10M;

    location / {
        proxy_pass http://eidolon_hub_api;
        proxy_http_version 1.1;
        proxy_set_header Host ;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
        proxy_set_header Upgrade ;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
