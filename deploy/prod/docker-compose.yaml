services:
  livekit:
    image: livekit/livekit-server:v1.11.0
    container_name: eidolon-livekit
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    command:
      - "--config"
      - "/etc/livekit.yaml"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  hub:
    build:
      context: ../..
      dockerfile: deploy/prod/Dockerfile.hub
    container_name: eidolon-hub-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:-http://host.docker.internal:7880}
    volumes:
      - hub_data:/app/data
      - hub_logs:/app/logs
    depends_on:
      - livekit

  web:
    build:
      context: ../..
      dockerfile: deploy/prod/Dockerfile.web
      args:
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-}
        NEXT_PUBLIC_LIVEKIT_TOKEN_URL: ${NEXT_PUBLIC_LIVEKIT_TOKEN_URL:-}
        NEXT_PUBLIC_APP_TITLE: ${NEXT_PUBLIC_APP_TITLE:-Eidolon Agent}
        NEXT_PUBLIC_DAEMON_WS_URL: ${NEXT_PUBLIC_DAEMON_WS_URL:-}
    container_name: eidolon-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - hub

  admin:
    build:
      context: ../..
      dockerfile: deploy/prod/Dockerfile.admin
      args:
        VITE_ADMIN_API_BASE: ${VITE_ADMIN_API_BASE:-http://127.0.0.1:8081/api/admin}
    container_name: eidolon-admin
    restart: unless-stopped
    ports:
      - "5174:5174"
    depends_on:
      - hub

volumes:
  hub_data:
  hub_logs:
